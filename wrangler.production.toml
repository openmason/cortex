# =============================================================================
# PRODUCTION - cortex.cognium.net
# Deploy: npx wrangler deploy -c wrangler.production.toml
# Account: cognium (REPLACE_WITH_COGNIUM_ACCOUNT_ID)
# =============================================================================

name = "cortex"
main = "src/index.ts"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]
account_id = "bb8e02ea0ca7c225d2fb62d24a9940be"

routes = [
  { pattern = "cortex.cognium.net", custom_domain = true }
]

[observability]
enabled = true

# --- Durable Objects ---
[[durable_objects.bindings]]
name = "WORKFLOW_DO"
class_name = "WorkflowDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkflowDurableObject"]

# --- KV Namespaces ---
[[kv_namespaces]]
binding = "SESSION_CACHE"
id = "d827ec6be74641ee8fa53a0af4cd7e1b"

[[kv_namespaces]]
binding = "WORKFLOW_STATE"
id = "d4180b7f747f47baa0c36f24b75dd0ef"

# --- Hyperdrive (Neon Postgres) ---
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "c9aee067341446239e483dbf6df25f96"
localConnectionString = "${DATABASE_URL}"

# --- R2 ---
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "cortex-artifacts"

# --- Service Bindings ---
# Note: Service binding must be in same account, so Runics must also be deployed to cognium account
[[services]]
binding = "RUNICS_SERVICE"
service = "runics"

# --- Workers AI ---
[ai]
binding = "AI"

# --- Analytics Engine ---
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "cortex_metrics"

# --- Environment Variables ---
[vars]
ENVIRONMENT = "production"
RUNICS_URL = "https://runics.cognium.net"
DAYTONA_TARGET = "us"
DAYTONA_API_URL = "https://app.daytona.io/api"
LLMPROXY_URL = "https://llmproxy.xus.one"
LLM_MODEL = "cognium/gpt-oss-120b"
DEFAULT_EXECUTION_MODE = "review_before_run"
DEFAULT_APPETITE = "balanced"
WORKFLOW_TIMEOUT_MS = "300000"
MAX_SKILL_CHAIN_DEPTH = "10"
CF_ACCOUNT_ID = "bb8e02ea0ca7c225d2fb62d24a9940be"

# --- Cron Triggers ---
[triggers]
crons = ["*/5 * * * *"]
