# =============================================================================
# PRODUCTION - cortex.cognium.net
# Deploy: npx wrangler deploy -c wrangler.production.toml
# Account: cognium (REPLACE_WITH_COGNIUM_ACCOUNT_ID)
# =============================================================================

name = "cortex"
main = "src/index.ts"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]
account_id = "bb8e02ea0ca7c225d2fb62d24a9940be"

routes = [
  { pattern = "cortex.cognium.net", custom_domain = true }
]

[observability]
enabled = true

# --- Durable Objects ---
[[durable_objects.bindings]]
name = "WORKFLOW_DO"
class_name = "WorkflowDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkflowDurableObject"]

# --- KV Namespaces ---
# Create with: npx wrangler kv:namespace create SESSION_CACHE -c wrangler.production.toml
# Create with: npx wrangler kv:namespace create WORKFLOW_STATE -c wrangler.production.toml
[[kv_namespaces]]
binding = "SESSION_CACHE"
id = "REPLACE_WITH_PROD_SESSION_CACHE_ID"

[[kv_namespaces]]
binding = "WORKFLOW_STATE"
id = "REPLACE_WITH_PROD_WORKFLOW_STATE_ID"

# --- Hyperdrive (Neon Postgres) ---
# Create with: npx wrangler hyperdrive create cortex-db -c wrangler.production.toml --connection-string="postgres://..."
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_PROD_HYPERDRIVE_ID"
localConnectionString = "${DATABASE_URL}"

# --- R2 ---
# Create with: npx wrangler r2 bucket create cortex-artifacts -c wrangler.production.toml
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "cortex-artifacts"

# --- Service Bindings ---
# Note: Service binding must be in same account, so Runics must also be deployed to cognium account
[[services]]
binding = "RUNICS_SERVICE"
service = "runics"

# --- Workers AI ---
[ai]
binding = "AI"

# --- Analytics Engine ---
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "cortex_metrics"

# --- Environment Variables ---
[vars]
ENVIRONMENT = "production"
RUNICS_URL = "https://runics.cognium.net"
DAYTONA_TARGET = "us"
DAYTONA_API_URL = "https://app.daytona.io/api"
LLMPROXY_URL = "https://llmproxy.xus.one"
LLM_MODEL = "cognium/gpt-oss-120b"
DEFAULT_EXECUTION_MODE = "review_before_run"
DEFAULT_APPETITE = "balanced"
WORKFLOW_TIMEOUT_MS = "300000"
MAX_SKILL_CHAIN_DEPTH = "10"
CF_ACCOUNT_ID = "bb8e02ea0ca7c225d2fb62d24a9940be"

# --- Cron Triggers ---
[triggers]
crons = ["*/5 * * * *"]
