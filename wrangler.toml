# =============================================================================
# STAGING - cortex.phantoms.workers.dev
# Deploy: npx wrangler deploy
# Account: phantoms (1f59f4dcd0ebb559e3c392566978d446)
# =============================================================================

name = "cortex"
main = "src/index.ts"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# --- Durable Objects ---
[[durable_objects.bindings]]
name = "WORKFLOW_DO"
class_name = "WorkflowDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkflowDurableObject"]

# --- KV Namespaces ---
[[kv_namespaces]]
binding = "SESSION_CACHE"
id = "41f4c080699548b78d8268dae976050f"

[[kv_namespaces]]
binding = "WORKFLOW_STATE"
id = "25de6e1a514e43f58ef7e4be921f3a43"

# --- Hyperdrive (Neon Postgres) ---
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "f61c21a7e1204ce4942c591cfe663b23"
localConnectionString = "${DATABASE_URL}"

# --- R2 ---
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "cortex-artifacts"

# --- Service Bindings ---
[[services]]
binding = "RUNICS_SERVICE"
service = "runics"

# --- Workers AI ---
[ai]
binding = "AI"

# --- Analytics Engine ---
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "cortex_metrics"

# --- Environment Variables ---
[vars]
ENVIRONMENT = "staging"
RUNICS_URL = "https://runics.phantoms.workers.dev"
DAYTONA_TARGET = "us"
DAYTONA_API_URL = "https://app.daytona.io/api"
LLMPROXY_URL = "https://llmproxy.xus.one"
LLM_MODEL = "cognium/gpt-oss-120b"
DEFAULT_EXECUTION_MODE = "review_before_run"
DEFAULT_APPETITE = "balanced"
WORKFLOW_TIMEOUT_MS = "300000"
MAX_SKILL_CHAIN_DEPTH = "10"
CF_ACCOUNT_ID = "1f59f4dcd0ebb559e3c392566978d446"

# --- Workflows ---
[[workflows]]
name = "skill-workflow"
binding = "SKILL_WORKFLOW"
class_name = "SkillWorkflow"

# --- Cron Triggers ---
[triggers]
crons = ["*/5 * * * *"]
